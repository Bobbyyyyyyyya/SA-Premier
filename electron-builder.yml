# SA Premier — AI-modellen: downloaden vs meeleveren
#
# Twee smaken voor users die de app downloaden:
#
#   LITE (aanbevolen, ~150 MB installer) — deze file
#     - Geen AI-modellen in de installer. App werkt ALTIJD:
#       monteren/editen/exporteren thumbnails alles lokaal via ffmpeg.
#     - Bij eerste start kiest de user in de AI-setup wizard voor
#       "Licht — download bij gebruik".
#     - ComfyUI / MusicGen / Ollama starten automatisch; modellen worden
#       pas gedownload als ze echt gebruikt worden (met voortgangsbalk
#       in het AI-paneel). Zonder servers valt Music terug op synth,
#       foto-AI toont een nette fout + downloadknop — nooit een crash.
#     - Bouwen:  npm run dist:lite
#
#   FULL (offline, ~8–15 GB installer) — zie electron-builder.full.yml
#
# De user kan altijd wisselen: Home → 🤖 AI-setup, of AI-paneel → Wijzig…
# Keuze wordt bewaard in <userData>/ai-setup.json:
#   { mode: ondemand|full|custom, comfy, music, ollama, completed }
# Uitgeschakelde engines starten niet automatisch op.

appId: com.sapremier.app
productName: SA Premier
# icoon: 1024px master in build/, electron-builder schaalt zelf naar alle formaten
directories:
  output: dist
publish:
  provider: github
  owner: Bobbyyyyyyyya
  repo: SA-Premier
  private: false
files:
  - out/**/*
  - package.json
  # runtime-deps die main nodig heeft (de rest komt via dependencies mee)
  - node_modules/ffmpeg-static/**/*
  - node_modules/fluent-ffmpeg/**/*
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.*'
  - '!**/node_modules/*/{CHANGELOG.md,README.md,README,readme.md,test,tests,__tests__,docs}'

# ffmpeg-binary kan niet vanuit asar draaien → altijd uitpakken.
# Plus kopie als extraResources/bin/ffmpeg als fallback (export.ts kijkt daar ook).
asarUnpack:
  - 'node_modules/ffmpeg-static/**/*'
extraResources:
  # fallback-kopie: komt terecht op <resources>/bin/ffmpeg (export.ts kijkt daar ook)
  - from: node_modules/ffmpeg-static
    to: bin
    filter:
      - ffmpeg
      - ffmpeg.exe
  # MusicGen-server. Zonder dit bestand verdwijnt de AI-muziek zodra iemand
  # ~/ComfyUI weggooit — music-ai.ts zoekt eerst hier, oude paden zijn fallback.
  - from: resources/ai
    to: ai
    filter:
      - '**/*'

mac:
  icon: build/icon.png
  category: public.app-category.video
  # DMG = de installer: sleepen naar Programma's. Verving het PKG-pakket, want
  # dat vroeg de AI-keuze al tijdens het installeren — nu kiest de user hem in
  # de eigen AI-setup wizard bij de eerste start, en dat is meteen aan te
  # passen zonder opnieuw te installeren.
  # ZIP blijft naast DMG: de auto-updater haalt op macOS de zip op, niet de dmg.
  target:
    - dmg
    - zip
  identity: '-'
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist

win:
  # NSIS .exe = de Windows-installer: wizard met welkom → voorwaarden → locatie → componenten → installatie
  target:
    - nsis
    - portable
  artifactName: "${productName} Setup ${version}.${ext}"
linux:
  maintainer: SA Premier <noreply@users.noreply.github.com>
  category: Video
  target:
    - AppImage
    - deb

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  runAfterFinish: true
  uninstallDisplayName: SA Premier
  include: build/installer.nsh
  warningsAsErrors: false
