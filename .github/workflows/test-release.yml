name: Test Release

on:
  push:
    tags:
      - 'v*-test*'
      - 'v*-beta*'
      - 'v*-alpha*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag voor test release (bv. v0.1.0-test.1)'
        required: false
        default: ''
      prerelease:
        description: 'Markeer als pre-release'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  # Alleen bouwen — snel, altijd groen ook zonder AI-modellen (Lite)
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: mac
          - os: ubuntu-latest
            label: linux
          - os: windows-latest
            label: win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install deps
        run: npm ci || (sleep 5 && npm ci)
      - name: Typecheck
        run: npm run typecheck
      - name: Build (vite)
        run: npm run build
      - name: Install electron-builder
        run: npm install --no-save electron-builder
      - name: Package Lite (echte installer — geen map)
        run: npx electron-builder --config electron-builder.yml --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          # Voor nu: ad-hoc signen → "kon niet scannen" i.p.v. "is beschadigd".
          # Voor notarization (geen waarschuwing): zet APPLE_ID / APPLE_ID_PASSWORD / APPLE_TEAM_ID als repo secrets.
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: List lite output
        shell: bash
        run: |
          set +o pipefail
          echo "=== dist (top) ==="; ls -lh dist 2>&1 | head -n 60 || true
          echo "=== find installers ==="; find dist -maxdepth 2 -type f \( -name "*.dmg" -o -name "*.zip" -o -name "*.pkg" -o -name "*.exe" -o -name "*.AppImage" -o -name "*.deb" -o -name "*.blockmap" \) -ls 2>&1 | head -n 60 || true
          echo "=== resources ==="; ls resources 2>&1 | head -n 20 || true
      - name: Upload Lite installers
        uses: actions/upload-artifact@v4
        with:
          name: lite-${{ matrix.label }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.pkg
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/*.blockmap
            dist/*.yml
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.tag }}" ]]; then
            echo "value=${{ inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "value=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          fi
      - name: Download all Lite artefacts
        uses: actions/download-artifact@v4
        with:
          path: artefacts
      - name: Gather installers for release
        shell: bash
        run: |
          set +o pipefail
          mkdir -p dist
          find artefacts -type f \( -name "*.dmg" -o -name "*.zip" -o -name "*.pkg" -o -name "*.exe" -o -name "*.AppImage" -o -name "*.deb" \) -exec cp -v {} dist/ \; 2>&1 | head -n 40 || true
          echo "=== artefacts ==="; ls -R artefacts 2>&1 | head -n 80 || true
          echo "=== dist ==="; ls -lh dist 2>&1 | head -n 60 || true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          name: SA Premier ${{ steps.tag.outputs.value }} (test)
          prerelease: ${{ inputs.prerelease != 'false' }}
          generate_release_notes: true
          body: |
            **Test release — Lite + echte installers (PKG/DMG/EXE), werkt altijd zonder AI**
            - macOS: `.pkg` = echte installer-wizard (voorwaarden → locatie → installatie) + `.dmg` (slepen). `.pkg` is de mac-equivalent van Windows `.exe` wizard (Setup Wizard / Custom installer). Linux: `.AppImage`/`.deb`.
            - Windows `.exe` is een Custom installer: wizard met AI-keuze (☁️ Licht / 📦 Volledig / 🛠️ Aangepast met vinkjes per engine).
            - macOS PKG/DMG en Linux tonen de AI-keuze daarna in de app zelf (🤖 AI-setup) —zelfde 3 opties, Lite werkt altijd zonder AI.
          files: |
            dist/*.dmg
            dist/*.zip
            dist/*.pkg
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
